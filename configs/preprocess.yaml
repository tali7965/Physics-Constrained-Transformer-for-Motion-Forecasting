# Root for raw and preprocessed Argoverse 2 data (external SSD).
# Override without editing this file:  export AV2_DATA_ROOT=/some/other/path
data_root: /Volumes/Lenovo PS8/VISION_DATASET

raw_subdir: raw
processed_subdir: processed

# Scene region and padding caps, chosen from 1,000 train + 1,000 val scenarios measured around
# the focal agent at the last observed step (t=49):
#   - 150 m covers the farthest focal future measured (max 149 m, p99 ~105 m).
#   - within 150 m, agents present at t=49: p99 60, max 82; lane segments: p99 161, max 211.
# Caps sit just above p99; beyond a cap the farthest elements are dropped and the count of
# affected scenes is recorded in each split's meta.json.
radius_m: 150
max_agents: 64   # includes the focal agent in slot 0
max_lanes: 192
