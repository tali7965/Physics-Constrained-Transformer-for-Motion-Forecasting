# Phase 5: configs/transformer.yaml with 10% of the training subset for 300 epochs (~23.7k steps, as
# many as a full run), dev scored every 10 epochs (~790 steps, once per full-subset epoch).
name: transformer-f10

# Train / dev protocol: identical to configs/lstm.yaml, so both models see the same rows.
protocol:
  seed: 0
  dev_size: 5000
  subset_size: 50000
  fraction: 0.1

model:
  type: transformer
  d: 128
  heads: 8
  encoder_layers: 4
  decoder_layers: 2
  ffn: 512
  dropout: 0.1
  modes: 6

train:
  epochs: 300
  eval_every: 10
  batch_size: 64
  lr: 1.0e-3
  grad_clip: 1.0
  seed: 0
  select: brier-minFDE@6   # dev metric for best.pt (K=6, the leaderboard metric)
