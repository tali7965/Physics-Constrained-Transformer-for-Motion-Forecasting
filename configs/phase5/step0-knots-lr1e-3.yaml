# Phase 5 step 0: physics head with controls at knots every 0.5 s (control_step 5), on the 10% subset for 30 epochs as in the
# Phase 4 lr sweep, lr 1.0e-3.
name: step0-knots-lr1e-3

# Train / dev protocol: identical to configs/lstm.yaml, so both models see the same rows.
protocol:
  seed: 0
  dev_size: 5000
  subset_size: 50000
  fraction: 0.1

model:
  type: transformer
  d: 128
  heads: 8
  encoder_layers: 4
  decoder_layers: 2
  ffn: 512
  dropout: 0.1
  modes: 6
  head: physics
  control_step: 5

train:
  epochs: 30
  batch_size: 64
  lr: 1.0e-3
  grad_clip: 1.0
  seed: 0
  select: brier-minFDE@6   # dev metric for best.pt (K=6, the leaderboard metric)
