# Phase 5: configs/physics.yaml with a single mode (K=1); best.pt by dev minFDE.
name: physics-k1

# Train / dev protocol: identical to configs/lstm.yaml, so both models see the same rows.
protocol:
  seed: 0
  dev_size: 5000
  subset_size: 50000
  fraction: 1.0

model:
  type: transformer
  d: 128
  heads: 8
  encoder_layers: 4
  decoder_layers: 2
  ffn: 512
  dropout: 0.1
  modes: 1
  head: physics

train:
  epochs: 30
  batch_size: 64
  lr: 3.0e-4
  grad_clip: 1.0
  seed: 0
  select: minFDE
