# Fine-tune the released physics head (weights/physics.pt) for 3 more epochs at a low learning rate.
name: ft-roadaware

protocol:
  seed: 0
  dev_size: 5000
  subset_size: 50000
  fraction: 1.0

model:
  type: transformer
  d: 128
  heads: 8
  encoder_layers: 4
  decoder_layers: 2
  ffn: 512
  dropout: 0.1
  modes: 6
  head: physics
  init_correction: true

train:
  epochs: 3
  batch_size: 64
  lr: 1.0e-4
  grad_clip: 1.0
  seed: 0
  select: brier-minFDE@6
  init_from: weights/physics.pt
  yaw_weight: 3.0
  map_weight: 1.0
  map_margin: 2.5

eval:
  lane_rerank: [1.5, 1.0]   # run-time lane re-ranking (margin m, weight per m), chosen on dev; --no-rerank disables
